<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音画不同步调节器 · 交互演示</title>
<style>
  :root {
    --bg: #0b0d10;
    --card: #121519;
    --line: #232a32;
    --text: #e7edf5;
    --muted: #8a94a3;
    --cyan: #4dd9ff;
    --green: #45e08a;
    --amber: #ffb454;
    --red: #ff5f56;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    background: var(--bg);
    color: var(--text);
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC",
      -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .rec * { transition: none !important; animation: none !important; }

  .wrap {
    flex: none;
    width: 920px;
    height: 560px;
    margin: 0 auto;
    padding: 22px 28px 18px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  header { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 9px; font-size: 16px; font-weight: 700; letter-spacing: .2px; }
  .brand i { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px rgba(69,224,138,.7); }
  .header-right { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; }
  .chip {
    padding: 4px 9px; border: 1px solid var(--line); border-radius: 999px;
    color: #b9c3d0; background: #12161b; font-size: 12px;
  }

  main { display: flex; gap: 22px; align-items: flex-start; }

  /* ---------------- 演示画面 ---------------- */
  .stage {
    width: 566px;
    height: 348px;
    padding: 16px 18px;
    background: linear-gradient(180deg, #14181d 0%, #101318 100%);
    border: 1px solid var(--line);
    border-radius: 16px;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .stage-head { display: flex; align-items: center; justify-content: space-between; }
  .tag {
    font-size: 11px; letter-spacing: .12em; color: #7f8a99;
    border: 1px solid #2b333d; border-radius: 5px; padding: 3px 7px;
  }
  .pill {
    font-size: 12px; padding: 4px 10px; border-radius: 999px;
    background: rgba(255,180,84,.12); color: var(--amber);
    border: 1px solid rgba(255,180,84,.28);
  }
  .pill.ok { background: rgba(69,224,138,.12); color: var(--green); border-color: rgba(69,224,138,.3); }

  .ruler { margin-top: 14px; }
  .lane { display: flex; align-items: center; height: 58px; }
  .lanelabel { width: 76px; flex: none; line-height: 1.25; }
  .lanelabel b { display: block; font-size: 13px; font-weight: 600; }
  .lanelabel span { font-size: 11px; color: var(--muted); }
  .lanelabel.hot b { color: var(--cyan); }
  .track { position: relative; flex: 1; height: 100%; }
  .track::before {
    content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px;
    background: linear-gradient(90deg, #262e38, #1b2128);
  }
  .dot {
    position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px;
    border-radius: 50%; background: #39424e; border: 1px solid #4a5563;
    transition: left .32s cubic-bezier(.4,0,.2,1), background .2s, box-shadow .2s;
  }
  .dot.a { background: #3a4653; border-color: #5b6a7a; }
  .dot.b { background: rgba(77,217,255,.16); border-color: rgba(77,217,255,.55); }
  .dot.hot.a { background: #cfe3f5; border-color: #eaf5ff; box-shadow: 0 0 12px rgba(207,227,245,.55); }
  .dot.hot.b { background: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 14px rgba(77,217,255,.6); }

  .gap { position: relative; height: 26px; margin-left: 76px; }
  .gap .bar {
    position: absolute; left: 30px; top: 12px; height: 2px; background: var(--amber);
    border-radius: 2px;
  }
  .gap .bar::before, .gap .bar::after {
    content: ""; position: absolute; top: -4px; width: 2px; height: 10px; background: var(--amber);
  }
  .gap .bar::before { left: 0; }
  .gap .bar::after { right: 0; }
  .gap .txt {
    position: absolute; top: 0; font-size: 11px; color: var(--amber);
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .gap.ok .bar { background: var(--green); }
  .gap.ok .bar::before, .gap.ok .bar::after { background: var(--green); }
  .gap.ok .txt { color: var(--green); }

  .offsetbox { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; }
  .offnum { font-variant-numeric: tabular-nums; line-height: 1; }
  .offnum b { font-size: 40px; font-weight: 700; color: var(--amber); letter-spacing: 1px; }
  .offnum.ok b { color: var(--green); }
  .offnum small { font-size: 14px; color: var(--muted); margin-left: 4px; }
  .offnote { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .meter2 { display: flex; gap: 3px; align-items: flex-end; height: 26px; }
  .meter2 i { width: 4px; border-radius: 2px; background: #2a333d; }

  /* ---------------- 面板（复刻扩展） ---------------- */
  .panel {
    width: 300px;
    background: #13161a;
    border: 1px solid #272e37;
    border-radius: 14px;
    box-shadow: 0 18px 40px rgba(0,0,0,.5);
    font-size: 13px;
    user-select: none;
  }
  .panel-head {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px; border-bottom: 1px solid #1f252d;
  }
  .panel-head .led { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  .panel-head .title { flex: 1; font-size: 13px; }
  .panel-head .win { color: #65707e; font-size: 14px; letter-spacing: 6px; }
  .panel-body { padding: 14px 14px 12px; }
  .bignum { text-align: center; font-variant-numeric: tabular-nums; margin: 2px 0 12px; }
  .bignum b { font-size: 40px; font-weight: 700; color: var(--cyan); letter-spacing: 1px; }
  .bignum small { font-size: 13px; color: #7f8a99; }
  .slider-wrap { padding: 4px 2px 14px; }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 18px; background: transparent; cursor: pointer; display: block;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 3px; border-radius: 2px;
    background: linear-gradient(90deg, var(--cyan) 0 var(--p, 50%), #333b45 var(--p, 50%) 100%);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; margin-top: -6.5px; border-radius: 50%;
    background: #f2fbff; border: 3px solid var(--cyan);
    box-shadow: 0 0 12px rgba(77,217,255,.5);
  }
  .presets { display: flex; gap: 6px; }
  .presets button {
    flex: 1; height: 30px; border-radius: 7px; border: 1px solid #2a323c;
    background: #1a1f25; color: #c3ccd8; font-size: 12px; cursor: pointer;
    font-family: inherit;
  }
  .presets button:hover { border-color: #3a4753; }
  .chips { display: flex; justify-content: space-between; margin-top: 12px; }
  .chips span {
    font-size: 11px; padding: 4px 9px; border-radius: 6px;
    border: 1px solid #2a323c; background: #1a1f25; color: #aab5c2;
  }
  .chips .ghost { color: #7e8896; border-style: dashed; }
  .meter { margin-top: 12px; height: 3px; border-radius: 2px; background: #2a323c; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 30%; background: var(--green); border-radius: 2px; }
  .panel-foot {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 14px 13px; border-top: 1px solid #1f252d;
  }
  .panel-foot .hint { font-size: 11px; color: #78838f; }
  .panel-foot button {
    height: 30px; padding: 0 15px; border-radius: 7px;
    border: 1px solid rgba(255,95,86,.65); background: transparent;
    color: var(--red); font-size: 12px; cursor: pointer; font-family: inherit;
  }

  /* ---------------- 底部 ---------------- */
  footer { margin-top: auto; }
  .caption { display: flex; align-items: center; gap: 9px; font-size: 15px; color: #d6dee8; }
  .step {
    flex: none; width: 20px; height: 20px; border-radius: 50%;
    background: #1b222a; border: 1px solid #2d3742; color: #9fabb9;
    font-size: 11px; display: grid; place-items: center;
  }
  .step.on { background: rgba(77,217,255,.14); border-color: rgba(77,217,255,.5); color: var(--cyan); }
  .note { margin-top: 8px; font-size: 11px; color: #6d7784; line-height: 1.5; }

  /* 录屏用的假鼠标 */
  .cursor { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; display: none; }
  .cursor .ring {
    position: absolute; left: -13px; top: -13px; width: 26px; height: 26px;
    border-radius: 50%; border: 2px solid rgba(77,217,255,.55);
    background: rgba(77,217,255,.12);
  }
  .cursor svg { position: absolute; left: -2px; top: -2px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.6)); }

  /* 开始按钮 */
  .start {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(11,13,16,.55); backdrop-filter: blur(1px); border-radius: 16px;
  }
  .start button {
    padding: 12px 26px; border-radius: 999px; border: 1px solid rgba(77,217,255,.55);
    background: rgba(77,217,255,.12); color: var(--cyan);
    font-size: 14px; font-family: inherit; cursor: pointer;
    box-shadow: 0 0 24px rgba(77,217,255,.18);
  }
  .start small { display: block; text-align: center; margin-top: 10px; color: #8b95a3; font-size: 11px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header>
    <div class="brand"><i></i>音画不同步调节器</div>
    <div class="header-right">
      <span>拖动滑块，声音实时跟着走</span>
      <span class="chip">无需安装</span>
    </div>
  </header>

  <main>
    <section class="stage">
      <div class="stage-head">
        <span class="tag">演示画面</span>
        <span class="pill" id="pill">声音比口型晚 0.60 秒</span>
      </div>

      <div class="ruler">
        <div class="lane">
          <div class="lanelabel" id="labelA"><b>画面</b><span>口型</span></div>
          <div class="track" id="trackA"></div>
        </div>
        <div class="gap" id="gap">
          <div class="bar" id="gapBar"></div>
          <div class="txt" id="gapTxt">600 ms</div>
        </div>
        <div class="lane">
          <div class="lanelabel" id="labelB"><b>声音</b><span>听到的</span></div>
          <div class="track" id="trackB"></div>
        </div>
      </div>

      <div class="offsetbox">
        <div>
          <div class="offnum" id="offnum"><b id="offval">+600</b><small>ms</small></div>
          <div class="offnote" id="offnote">声音比画面晚</div>
        </div>
        <div class="meter2" id="meter2"></div>
      </div>

      <div class="start" id="start">
        <div>
          <button id="startBtn">▶ 开始演示</button>
          <small>会播放节拍声，建议戴耳机</small>
        </div>
      </div>
    </section>

    <aside class="panel" id="panel">
      <div class="panel-head">
        <span class="led"></span>
        <span class="title">音画不同步调节器</span>
        <span class="win">− ×</span>
      </div>
      <div class="panel-body">
        <div class="bignum"><b id="bignum">0.600</b><small>s</small></div>
        <div class="slider-wrap">
          <input id="slider" type="range" min="0" max="1200" step="10" value="600" aria-label="调节延迟">
        </div>
        <div class="presets">
          <button data-add="-1000">−1s</button>
          <button data-add="-100">−100</button>
          <button data-add="0">归零</button>
          <button data-add="100">+100</button>
          <button data-add="1000">+1s</button>
        </div>
        <div class="chips">
          <span>延迟</span>
          <span class="ghost">演示模式</span>
        </div>
        <div class="meter"><i id="meterFill"></i></div>
      </div>
      <div class="panel-foot">
        <span class="hint">只延后声音 · 滚轮可调</span>
        <button id="stopBtn">停止</button>
      </div>
    </aside>
  </main>

  <footer>
    <div class="caption"><span class="step on" id="step">1</span><span id="caption">声音总比口型晚半拍，先拖一下滑块</span></div>
    <div class="note">演示页：节拍声由浏览器实时合成，滑块控制的是真实延迟（DelayNode）；不采集标签页音频，也不需要装扩展。</div>
  </footer>
</div>

<div class="cursor" id="cursor">
  <span class="ring"></span>
  <svg width="18" height="22" viewBox="0 0 18 22">
    <path d="M2 2 L2 17 L6.4 13.2 L9.2 20 L12.3 18.6 L9.5 12 L15.4 11.8 Z"
      fill="#fff" stroke="#0b0d10" stroke-width="1.4" stroke-linejoin="round"/>
  </svg>
</div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var BEAT = 1.0;              /* 节拍间隔（秒） */
  var MAX_DELAY = 1200;        /* ms */
  var PX_PER_MS = 0.0833;      /* 时间轴比例：1200ms ≈ 100px */
  var trash = [];

  var params = new URLSearchParams(location.search);
  var recT = params.has('t') ? parseFloat(params.get('t')) : null;
  var isRec = recT !== null && isFinite(recT);
  if (isRec) document.body.classList.add('rec');

  var state = { delay: 600, ctx: null, delayNode: null, analyser: null, timer: null, next: 0, running: false };

  /* ---------------- 时间轴 ---------------- */
  var BASE = [20, 120, 220, 320];
  var dotA = [], dotB = [];
  BASE.forEach(function (x) {
    var a = document.createElement('i');
    a.className = 'dot a';
    a.style.left = x + 'px';
    $('trackA').appendChild(a);
    dotA.push(a);

    var b = document.createElement('i');
    b.className = 'dot b';
    b.style.left = x + 'px';
    $('trackB').appendChild(b);
    dotB.push(b);
  });

  var bar = $('meter2');
  var bars = [];
  for (var i = 0; i < 18; i++) {
    var el = document.createElement('i');
    el.style.height = (4 + (i % 6) * 2) + 'px';
    bar.appendChild(el);
    bars.push(el);
  }

  function clamp(v) { return Math.max(0, Math.min(MAX_DELAY, Math.round(v))); }

  function paintDelay(ms) {
    state.delay = ms;
    var pct = (ms / MAX_DELAY) * 100;
    var slider = $('slider');
    if (slider.value !== String(ms)) slider.value = String(ms);
    slider.style.setProperty('--p', pct + '%');
    $('bignum').textContent = (ms / 1000).toFixed(3);
    $('offval').textContent = (ms > 0 ? '+' : '') + ms;
    $('offnum').classList.toggle('ok', ms === 0);
    $('offnote').textContent = ms === 0 ? '已经对齐' : '声音比画面晚';

    var shift = ms * PX_PER_MS;
    dotB.forEach(function (d, idx) { d.style.left = (BASE[idx] + shift) + 'px'; });

    var ok = ms < 20;
    $('gap').classList.toggle('ok', ok);
    $('gapBar').style.width = Math.max(0, shift) + 'px';
    $('gapTxt').textContent = ok ? '已对齐' : ms + ' ms';
    $('gapTxt').style.left = (30 + Math.max(0, shift) + 8) + 'px';
    $('gapTxt').style.display = ok ? 'none' : 'block';
    $('gapBar').style.display = ok ? 'none' : 'block';

    var linked = state.ctx && state.running;
    if (linked) {
      var node = state.delayNode;
      var now = state.ctx.currentTime;
      node.delayTime.cancelScheduledValues(now);
      node.delayTime.setValueAtTime(node.delayTime.value, now);
      node.delayTime.linearRampToValueAtTime(ms / 1000, now + 0.06);
    }

    setCaption(ms);
    syncStart();
  }

  function setCaption(ms) {
    var step = $('step');
    var cap = $('caption');
    if (isRec) return;                    /* 录屏模式的文案由 recRender 控制 */
    if (!state.running) {
      step.textContent = '1';
      cap.textContent = '先点开始，听听声音和口型差多少';
      $('pill').textContent = ms > 0 ? '声音比口型晚 ' + (ms / 1000).toFixed(2) + ' 秒' : '已经对齐';
      $('pill').classList.toggle('ok', ms === 0);
      return;
    }
    if (ms === 0) {
      step.textContent = '✓';
      cap.textContent = '对上了 —— 口型和声音在同一刻';
      $('pill').textContent = '已对齐';
      $('pill').classList.add('ok');
    } else {
      step.textContent = '2';
      cap.textContent = '听着节拍拖动滑块，直到声音和口型对上';
      $('pill').textContent = '声音比口型晚 ' + (ms / 1000).toFixed(2) + ' 秒';
      $('pill').classList.remove('ok');
    }
  }

  /* 录屏模式下：让开始遮罩根据状态隐藏 */
  function syncStart() {
    if (isRec) { $('start').style.display = 'none'; return; }
    $('start').style.display = state.running ? 'none' : 'grid';
  }

  /* ---------------- 音频（点击开始后才创建） ---------------- */
  function startAudio() {
    if (state.running) return;
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) { $('caption').textContent = '这个浏览器不支持 Web Audio，换个浏览器试试'; return; }
    var ctx = new Ctx();
    var delayNode = ctx.createDelay(2);
    delayNode.delayTime.value = state.delay / 1000;
    var analyser = ctx.createAnalyser();
    analyser.fftSize = 256;
    delayNode.connect(analyser);
    analyser.connect(ctx.destination);

    state.ctx = ctx;
    state.delayNode = delayNode;
    state.analyser = analyser;
    state.running = true;
    state.next = ctx.currentTime + 0.15;
    state.timer = setInterval(schedule, 60);
    setCaption(state.delay);
    syncStart();
    rafLoop();
  }

  function schedule() {
    var ctx = state.ctx;
    while (state.next < ctx.currentTime + 0.3) {
      clickAt(state.next);
      state.next += BEAT;
    }
  }

  function clickAt(t) {
    var ctx = state.ctx;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1050, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.35, t + 0.004);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
    osc.connect(gain);
    gain.connect(state.delayNode);
    osc.start(t);
    osc.stop(t + 0.14);
    trash.push(osc);
    if (trash.length > 20) trash.shift();
  }

  var buf = null;
  function rafLoop() {
    if (!state.running) return;
    requestAnimationFrame(rafLoop);
    var ctx = state.ctx;
    var now = ctx.currentTime;
    if (!buf) buf = new Uint8Array(state.analyser.frequencyBinCount);
    state.analyser.getByteTimeDomainData(buf);
    var sum = 0;
    for (var i = 0; i < buf.length; i++) {
      var v = (buf[i] - 128) / 128;
      sum += v * v;
    }
    var rms = Math.sqrt(sum / buf.length);
    paintMeter(Math.min(1, rms * 6), now);

    var phase = ((now - state.delay / 1000) % BEAT + BEAT) % BEAT;
    var env = Math.exp(-phase * 7);
    $('labelB').classList.toggle('hot', env > 0.45);
    $('labelA').classList.toggle('hot', (now % BEAT) < 0.14);
  }

  function paintMeter(level, time) {
    var n = bars.length;
    for (var i = 0; i < n; i++) {
      var center = 1 - Math.abs(i - (n - 1) / 2) / ((n - 1) / 2);
      var on = level * 1.25 > center * (0.55 + 0.45 * center);
      bars[i].style.background = on ? '#45e08a' : '#2a333d';
    }
    $('meterFill').style.width = (12 + level * 82) + '%';
    dotsPulse(time, level);
  }

  function dotsPulse(time, level) {
    var audioPhase = ((time - state.delay / 1000) % BEAT + BEAT) % BEAT;
    var visualPhase = (time % BEAT + BEAT) % BEAT;
    dotA.forEach(function (d, i) {
      d.classList.toggle('hot', i === 0 && visualPhase < 0.12);
    });
    dotB.forEach(function (d, i) {
      d.classList.toggle('hot', i === 0 && audioPhase < 0.2 && level > 0.05);
    });
  }

  /* ---------------- 录屏模式：按时间还原状态 ---------------- */
  function delayAt(t) {
    if (t < 1.6) return 600;
    if (t < 3.8) return 600 - (t - 1.6) / 2.2 * 300;   /* 600 → 300 */
    if (t < 4.4) return 300;
    if (t < 6.2) return 300 - (t - 4.4) / 1.8 * 300;   /* 300 → 0 */
    if (t < 7.4) return 0;
    if (t < 8.2) return (t - 7.4) / 0.8 * 120;          /* 微调 0 → 120 */
    if (t < 9.0) return 120 - (t - 8.2) / 0.8 * 120;    /* 微调 120 → 0 */
    return 0;
  }

  function recRender(t) {
    var ms = clamp(delayAt(t));
    paintDelay(ms);

    var dragging = (t >= 1.6 && t < 6.25) || (t >= 7.35 && t < 9.05);
    $('cursor').style.display = dragging ? 'block' : 'none';
    if (dragging) {
      var sr = $('slider').getBoundingClientRect();
      var x = sr.left + (ms / MAX_DELAY) * sr.width;
      var y = sr.top + sr.height / 2;
      $('cursor').style.left = x + 'px';
      $('cursor').style.top = y + 'px';
    }

    var cap, step, pill;
    if (t < 1.6) {
      step = '1'; cap = '声音总比口型晚半拍，先拖一下滑块';
      pill = '声音比口型晚 0.60 秒';
    } else if (t < 4.4) {
      step = '2'; cap = '拖动滑块，把声音一点点拉回来';
      pill = '声音比口型晚 ' + (ms / 1000).toFixed(2) + ' 秒';
    } else if (t < 6.2) {
      step = '2'; cap = '继续往前拖，差得越来越少了';
      pill = '声音比口型晚 ' + (ms / 1000).toFixed(2) + ' 秒';
    } else if (t < 7.4) {
      step = '✓'; cap = '对上了 —— 口型和声音在同一刻';
      pill = '已对齐';
    } else if (t < 9.0) {
      step = '2'; cap = '随时可以微调，声音实时跟着走';
      pill = '声音比口型晚 ' + (ms / 1000).toFixed(2) + ' 秒';
    } else {
      step = '✓'; cap = '对上了 —— 口型和声音在同一刻';
      pill = '已对齐';
    }
    $('step').textContent = step;
    $('caption').textContent = cap;
    $('pill').textContent = pill;
    $('pill').classList.toggle('ok', (t >= 6.2 && t < 7.4) || t >= 9.0);

    /* 让菱形电平条和节拍在静态帧里也有动感 */
    var env = Math.exp(-((t % BEAT) * 7));
    paintMeterStatic(env);
    var aph = (((t - ms / 1000) % BEAT) + BEAT) % BEAT;
    $('labelA').classList.toggle('hot', (t % BEAT) < 0.16);
    $('labelB').classList.toggle('hot', aph < 0.18);
    dotA[0].classList.toggle('hot', (t % BEAT) < 0.16);
    dotB[0].classList.toggle('hot', aph < 0.18);
  }

  function paintMeterStatic(env) {
    var n = bars.length;
    for (var i = 0; i < n; i++) {
      var center = 1 - Math.abs(i - (n - 1) / 2) / ((n - 1) / 2);
      var on = env > center * 0.55;
      bars[i].style.background = on ? '#45e08a' : '#2a333d';
    }
    $('meterFill').style.width = (12 + env * 70) + '%';
  }

  /* ---------------- 交互 ---------------- */
  $('slider').addEventListener('input', function (e) {
    paintDelay(clamp(+e.target.value));
  });

  $('slider').addEventListener('wheel', function (e) {
    e.preventDefault();
    var step = e.shiftKey ? 1000 : 100;
    paintDelay(clamp(state.delay + (e.deltaY < 0 ? step : -step)));
  }, { passive: false });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    var step = e.shiftKey ? 1000 : 100;
    paintDelay(clamp(state.delay + (e.key === 'ArrowRight' ? step : -step)));
    e.preventDefault();
  });

  document.querySelectorAll('.presets button').forEach(function (b) {
    b.addEventListener('click', function () {
      var add = +b.dataset.add;
      paintDelay(add === 0 ? 0 : clamp(state.delay + add));
    });
  });

  $('startBtn').addEventListener('click', startAudio);

  $('stopBtn').addEventListener('click', function () {
    if (isRec) return;
    state.running = false;
    if (state.timer) clearInterval(state.timer);
    state.timer = null;
    if (state.ctx) state.ctx.close();
    state.ctx = null;
    paintDelay(0);
    $('start').style.display = 'grid';
    $('caption').textContent = '已停止，声音回到页面';
    $('pill').textContent = '未接管';
    $('pill').classList.remove('ok');
  });

  if (isRec) {
    recRender(recT);
  } else {
    paintDelay(state.delay);
    syncStart();
  }
})();
</script>
</body>
</html>
